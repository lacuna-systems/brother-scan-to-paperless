name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check syntax
        run: python -m compileall -q src tests

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run tests with coverage
        run: |
          PYTHONPATH=src python -m coverage run -m unittest discover \
            -s tests -t . -v
          python -m coverage report

      - name: Check install script syntax
        run: bash -n install.sh

      - name: Check uninstall script syntax
        run: bash -n uninstall.sh

      - name: Validate Compose configuration
        run: |
          docker compose \
            --env-file .env.example \
            --profile brscan4 \
            --profile brscan5 \
            config --format json > /tmp/compose-consume.json
          DELIVERY_MODE=api \
          COMPOSE_FILE=compose.yaml \
          PAPERLESS_CONSUME_DIR='' \
          PAPERLESS_URL=https://paperless.example.com \
          PAPERLESS_API_TOKEN=test-token \
          docker compose \
            --env-file .env.example \
            --profile brscan4 \
            --profile brscan5 \
            config --format json > /tmp/compose-api.json
          python - <<'PY'
          import json

          with open("/tmp/compose-consume.json") as file:
              consume = json.load(file)
          with open("/tmp/compose-api.json") as file:
              api = json.load(file)

          for service in ("brscan4", "brscan5"):
              assert consume["services"][service]["environment"]["CONSUME_DIR"] == "/consume"
              assert api["services"][service]["environment"]["CONSUME_DIR"] == ""
              assert api["services"][service]["environment"]["PAPERLESS_ALLOW_INSECURE_HTTP"] == "false"
              assert "DAC_OVERRIDE" in consume["services"][service]["cap_add"]
              assert "cap_add" not in api["services"][service]
              consume_mounts = consume["services"][service]["volumes"]
              assert any(
                  mount["target"] == "/consume"
                  and mount["type"] == "bind"
                  and mount["bind"].get("selinux") == "z"
                  and mount["bind"].get("create_host_path", True) is True
                  for mount in consume_mounts
              )
              assert all(
                  mount["target"] != "/consume"
                  for mount in api["services"][service]["volumes"]
              )
          PY

  docker:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: brscan4
            version: "4"
            model: DCP-L2540DW
          - target: brscan5
            version: "5"
            model: DCP-L3560CDW
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          target: ${{ matrix.target }}
          load: true
          tags: brother-scan-to-paperless:${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Smoke test ${{ matrix.target }} image
        env:
          IMAGE: brother-scan-to-paperless:${{ matrix.target }}
          EXPECTED_DRIVER: ${{ matrix.version }}
          SCANNER_MODEL: ${{ matrix.model }}
        run: |
          license=$(docker image inspect --format \
            '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' \
            "$IMAGE")
          test "$license" = "MIT AND LicenseRef-Brother-EULA"
          docker run --rm "$IMAGE" --version
          docker run --rm \
            --env EXPECTED_DRIVER \
            --env SCANNER_MODEL \
            --entrypoint sh \
            "$IMAGE" -ec '
            command -v scanimage
            command -v snmpget
            command -v snmpset
            command -v tiffcp
            command -v tiff2pdf
            test -s /etc/ssl/certs/ca-certificates.crt
            test "$(stat -c %a /staging)" = 700

            test "$BRSCAN_VERSION" = "$EXPECTED_DRIVER"
            test "$SCANNER_DEVICE" = "brother${EXPECTED_DRIVER}:net1;dev0"
            command -v "brsaneconfig${BRSCAN_VERSION}"
            grep -x "brother${BRSCAN_VERSION}" /etc/sane.d/dll.conf
            "brsaneconfig${BRSCAN_VERSION}" -a \
              name=SMOKE model="${SCANNER_MODEL}" ip=192.0.2.10
            scanimage -L | grep "$SCANNER_DEVICE"
          '

          exit_code=0
          output=$(timeout 15s docker run --rm \
            --env PRINTER_IP=192.0.2.10 \
            --env HOST_IP=192.0.2.20 \
            --env CONSUME_DIR=/tmp \
            "$IMAGE" run 2>&1) || exit_code=$?
          if [ "$exit_code" -eq 0 ]; then
            echo "Invalid scanner configuration unexpectedly started" >&2
            exit 1
          fi
          if [ "$exit_code" -eq 124 ]; then
            echo "Invalid scanner configuration test timed out" >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep "SCANNER_MODEL is required"

          if output=$(docker run --rm \
            --env SKIP_SCANNER_REGISTRATION=true \
            --env PRINTER_IP=192.0.2.10 \
            --env HOST_IP=192.0.2.20 \
            --env SCANNER_MODEL \
            "$IMAGE" run 2>&1); then
            echo "Consume mode unexpectedly started without a mount" >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep "consume_dir is required"

      - name: Smoke test API delivery in ${{ matrix.target }} image
        env:
          IMAGE: brother-scan-to-paperless:${{ matrix.target }}
          EXPECTED_DRIVER: ${{ matrix.version }}
          SCANNER_MODEL: ${{ matrix.model }}
        run: |
          rm -f /tmp/mock-paperless-ready
          python - <<'PY' &
          import http.server
          from pathlib import Path

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers["Content-Length"])
                  body = self.rfile.read(length)
                  assert self.path == "/prefix/api/documents/post_document/"
                  assert self.headers["Authorization"] == "Token container-secret"
                  assert b'name="document"' in body
                  assert b"fake scan image" in body
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(
                      b'"8592f8d5-e1e5-4752-b9b0-294f3c1e9996"'
                  )

              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(("127.0.0.1", 18081), Handler)
          Path("/tmp/mock-paperless-ready").touch()
          server.handle_request()
          PY
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          while [ ! -e /tmp/mock-paperless-ready ]; do
            kill -0 "$server_pid"
            sleep 0.1
          done

          output=$(docker run --rm --network host \
            --env DELIVERY_MODE=api \
            --env PRINTER_IP=192.0.2.10 \
            --env HOST_IP=192.0.2.20 \
            --env SCANNER_MODEL="$SCANNER_MODEL" \
            --env PAPERLESS_URL=http://127.0.0.1:18081/prefix \
            --env PAPERLESS_API_TOKEN=container-secret \
            --env PAPERLESS_ALLOW_INSECURE_HTTP=true \
            --mount \
              "type=bind,source=${PWD}/tests/fake_scanimage.sh,target=/usr/local/bin/scanimage,readonly" \
            "$IMAGE" test 2>&1)
          printf '%s\n' "$output" | grep \
            "Registered ${SCANNER_MODEL} at 192.0.2.10 with brsaneconfig${EXPECTED_DRIVER}"
          printf '%s\n' "$output" | grep "Test scan succeeded!"
          wait "$server_pid"
          trap - EXIT

      - name: Export tested ${{ matrix.target }} image
        if: github.event_name == 'push'
        env:
          IMAGE: brother-scan-to-paperless:${{ matrix.target }}
          TARGET: ${{ matrix.target }}
        run: docker save --output "/tmp/${TARGET}.tar" "$IMAGE"

      - name: Store tested ${{ matrix.target }} image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.target }}
          path: /tmp/${{ matrix.target }}.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    if: github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [brscan4, brscan5]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.target }},enable={{is_default_branch}}
            type=ref,event=branch,prefix=${{ matrix.target }}-
            type=semver,pattern={{version}},prefix=${{ matrix.target }}-
            type=semver,pattern={{major}}.{{minor}},prefix=${{ matrix.target }}-
            type=raw,value=${{ matrix.target }}-sha-${{ github.sha }}

      - name: Restore tested ${{ matrix.target }} image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-${{ matrix.target }}
          path: /tmp/image

      - name: Load tested ${{ matrix.target }} image
        run: docker load --input /tmp/image/${{ matrix.target }}.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested ${{ matrix.target }} candidate
        env:
          IMAGE: brother-scan-to-paperless:${{ matrix.target }}
          TARGET: ${{ matrix.target }}
        run: |
          candidate="ghcr.io/${GITHUB_REPOSITORY,,}:${TARGET}-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag "$IMAGE" "$candidate"
          docker push "$candidate"

      - name: Promote tested ${{ matrix.target }} image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          TARGET: ${{ matrix.target }}
        run: |
          candidate="ghcr.io/${GITHUB_REPOSITORY,,}:${TARGET}-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tag_args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tag_args+=(--tag "$tag")
            fi
          done <<< "$TAGS"
          test "${#tag_args[@]}" -gt 0
          docker buildx imagetools create "${tag_args[@]}" "$candidate"
