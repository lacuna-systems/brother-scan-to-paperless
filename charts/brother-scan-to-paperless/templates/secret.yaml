{{- if and (include "brother-scan-to-paperless.apiMode" .) (not .Values.paperless.existingSecret) .Values.paperless.apiToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "brother-scan-to-paperless.tokenSecretName" . }}
  labels:
    {{- include "brother-scan-to-paperless.labels" . | nindent 4 }}
type: Opaque
data:
  apiToken: {{ .Values.paperless.apiToken | b64enc | quote }}
{{- end }}
